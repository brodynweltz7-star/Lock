'use strict';const KEY='brodyn_lockin_2027_v1';const START='2026-10-19';const RACES=[{name:'River Run Half Marathon',date:'2027-05-30',goal:'PR · 21.1 km'},{name:'Backyard Ultra',date:'2027-08-01',goal:'15 loops · 100.59 km'},{name:'Detroit Marathon',date:'2027-10-17',goal:'Finish · 42.2 km'}];const PHASES=[{name:'Base + Winter Lock-In',start:'2026-10-19',end:'2026-12-27',range:'Build from actual baseline',goal:'4 runs · 3 lifts · aerobic consistency'},{name:'Half Marathon Development',start:'2026-12-28',end:'2027-03-28',range:'Conditional 35–55 km/wk',goal:'Threshold + progress toward 5 runs'},{name:'Half Marathon Peak',start:'2027-03-29',end:'2027-05-16',range:'Conditional 45–65 km/wk',goal:'Race-specific long runs + controlled tempo'},{name:'Half Marathon Taper',start:'2027-05-17',end:'2027-05-30',range:'Reduce volume',goal:'Fresh legs for PR attempt'},{name:'Recover + Ultra Transition',start:'2027-05-31',end:'2027-06-13',range:'Recovery-dependent',goal:'Recover, restore easy running'},{name:'Backyard Ultra Build',start:'2027-06-14',end:'2027-07-11',range:'Conditional 45–75 km/wk',goal:'Easy volume, loops, back-to-back runs'},{name:'Backyard Ultra Taper',start:'2027-07-12',end:'2027-08-01',range:'Reduce volume',goal:'Fueling rehearsed, legs fresh'},{name:'Ultra Recovery',start:'2027-08-02',end:'2027-08-22',range:'No fixed mileage',goal:'Walk, recover, resume when ready'},{name:'Marathon Rebuild',start:'2027-08-23',end:'2027-10-03',range:'Conditional 30–60 km/wk',goal:'Long-run endurance, controlled marathon effort'},{name:'Marathon Taper',start:'2027-10-04',end:'2027-10-17',range:'Reduce volume',goal:'Finish Detroit healthy'}];const STRENGTH={upperA:[['Incline dumbbell press','3 × 6–10'],['Lat pulldown','3 × 6–10'],['Chest-supported row','3 × 8–12'],['Dumbbell shoulder press','2 × 8–10'],['Cable lateral raise','3 × 12–20'],['Face pull','2 × 12–20'],['EZ-bar curl','3 × 8–12'],['Rope triceps pushdown','3 × 8–12']],lower:[['Bulgarian split squat','3 × 6–8 / leg'],['Dumbbell Romanian deadlift','3 × 6–10'],['Seated or lying hamstring curl','2 × 10–15'],['Standing calf raise','3 × 10–15'],['Tibialis raise','2 × 15–20'],['Copenhagen plank','2 × 20–30 sec / side']],upperB:[['Machine chest press','3 × 8–12'],['Seated cable row','3 × 8–12'],['Neutral-grip pulldown','2 × 8–12'],['Rear-delt fly','3 × 12–20'],['Cable lateral raise','3 × 12–20'],['Hammer curl','3 × 8–12'],['Overhead rope triceps extension','3 × 10–15'],['Pallof press','2 × 10–12 / side'],['Farmer carry','2 × 30–40 m']]};const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}db.logs ||= {};db.lifts ||= {};db.reviews ||= {};db.wellness ||= {};db.prs ||= {five:'21:11',ten:'44:08',half:'1:50:00',marathon:''};db.settings ||= {baseline:'',longRun:'',notes:'',targetHalf:'',weeklyGoal:'',startingWeek:'2026-10-19',runDays:'4'};db.settings.runDays ||= '4';db.body ||= {};let tab='home';let selectedWeek=weekMonday(new Date())<'2026-10-19'?'2026-10-19':weekMonday(new Date());function dateUTC(s){return new Date(s+'T12:00:00Z')}function iso(d){return d.toISOString().slice(0,10)}function plus(s,n){let d=dateUTC(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}function weekMonday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-(x.getDay()+6)%7);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function fmt(s){return dateUTC(s).toLocaleDateString('en-CA',{month:'short',day:'numeric',timeZone:'UTC'})}function phaseAt(s){return PHASES.find(p=>s>=p.start&&s<=p.end)|| (s<PHASES[0].start?PHASES[0]:PHASES.at(-1))}function dayDiff(a,b){return Math.round((dateUTC(b)-dateUTC(a))/86400000)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage unavailable. Export your backup now.')}}function logFor(s){return db.logs[s]||{}}function phaseDays(phase){if(phase.name.startsWith('Base'))return [{title:'Long run + mobility',type:'run',detail:'Easy pace. Start from your comfortable distance; do not force a target.'},{title:'Upper A + foot/ankle',type:'gym',detail:'Strength; 2 reps in reserve. 5–10 min ankle work.',lift:'upperA'},{title:'Intervals + reduced Lower',type:'both',detail:'Controlled 400–800m repeats or short threshold. Easy warm-up/cooldown. Lower session reduced.',lift:'lower'},{title:'Upper B + core + foot/ankle',type:'gym',detail:'Upper hypertrophy; ankle work 5–10 min.',lift:'upperB'},{title:'Easy run + strides',type:'run',detail:'Conversational pace. Finish with 4–6 × 20-sec strides when fresh.'},{title:'Saturday threshold',type:'run',detail:'Structured threshold workout every Saturday, with warm-up, controlled repetitions and cooldown.'},{title:'Recovery / rest',type:'rest',detail:'Walk, mobility, or full rest. No make-up sessions.'}];if(phase.name.includes('Half Marathon Development'))return [{title:'Easy aerobic',type:'run',detail:' easy, 6–8 km if your baseline supports it.'},{title:'Upper A + foot/ankle',type:'gym',detail:'Strength, avoid failure.',lift:'upperA'},{title:'Threshold intervals + Lower',type:'both',detail:'Example: 4 × 6 min threshold, 2-min jog; warm-up/cooldown. Reduced Lower if recovered.',lift:'lower'},{title:'Upper B + core',type:'gym',detail:'Maintain upper-body strength.',lift:'upperB'},{title:'Easy + strides',type:'run',detail:' easy, 6–9 km, optional 4–6 strides.'},{title:'Easy long run',type:'run',detail:' easy. Progress from recent long-run baseline toward 16–20 km.'},{title:'Rest or short recovery',type:'run',detail:'Optional 4–6 km 2 only if adapted to 5 runs.'}];if(phase.name.includes('Half Marathon Peak'))return [{title:'Easy recovery',type:'run',detail:'6–8 km easy if adapted.'},{title:'Upper A',type:'gym',detail:'Short maintenance workout.',lift:'upperA'},{title:'Threshold session',type:'run',detail:'Example 3 × 10 min threshold with 2-min jog, total 10–13 km.'},{title:'Easy + light Lower',type:'both',detail:'Easy pace–9 km, easy. Lower volume reduced.',lift:'lower'},{title:'Easy + strides',type:'run',detail:'5–7 km easy, 4 × 20-sec strides.'},{title:'Long run',type:'run',detail:'Easy 18–24 km only if built up. Some weeks final 4–6 km controlled HM effort; alternate fully easy.'},{title:'Rest',type:'rest',detail:'Recover.'}];if(phase.name.includes('Half Marathon Taper'))return [{title:'Easy',type:'run',detail:'Short easy pace; reduce overall weekly volume.'},{title:'Light Upper A',type:'gym',detail:'Optional light strength only.',lift:'upperA'},{title:'Brief threshold touch',type:'run',detail:'Small controlled dose, no maximal efforts.'},{title:'Rest or easy',type:'rest',detail:'Keep legs fresh.'},{title:'Easy + short strides',type:'run',detail:'Brief relaxed run if not within 24h of race.'},{title:'Rest / shakeout',type:'rest',detail:'No fatigue.'},{title:'Race / recovery',type:'run',detail:'May 30: Half Marathon. Other days: easy recovery.'}];if(phase.name.includes('Ultra Transition')||phase.name.includes('Ultra Recovery'))return DAYN.map((_,i)=>({title:i===0?'Full rest / recovery':i===3?'Optional gentle walk or mobility':'Recovery-dependent',type:'rest',detail:'No mileage target. Resume short easy runs only when walking and daily activities are comfortable; persistent pain or fatigue = more recovery.'}));if(phase.name.includes('Backyard Ultra Build'))return [{title:'Rest + mobility',type:'rest',detail:'Full recovery day.'},{title:'Easy + Upper A',type:'both',detail:'8–10 km easy if built up; short upper maintenance.',lift:'upperA'},{title:'Easy aerobic',type:'run',detail:'8–12 km easy.'},{title:'Easy + light Lower',type:'both',detail:'6–8 km easy; minimal soreness from strength.',lift:'lower'},{title:'Recovery run',type:'run',detail:'4–6 km 2.'},{title:'Long easy / loop simulation',type:'run',detail:'18–24 km easy or 3–5 hourly 6.706 km loops (replace other mileage). Fuel and walk.'},{title:'Back-to-back easy',type:'run',detail:'8–14 km easy on tired legs, or rest after loop simulation.'}];if(phase.name.includes('Backyard Ultra Taper'))return [{title:'Rest',type:'rest',detail:'Recover.'},{title:'Easy short run',type:'run',detail:'Reduced volume, easy.'},{title:'Easy short run',type:'run',detail:'Relaxed, no major fatigue.'},{title:'Mobility',type:'rest',detail:'Gear and fueling checklist.'},{title:'Optional shakeout',type:'run',detail:'Very easy if recovered.'},{title:'Rest',type:'rest',detail:'Fuel, hydrate normally, prepare crew setup.'},{title:'Race / easy',type:'run',detail:'August 1: Backyard Ultra. Aim 15 completed loops.'}];if(phase.name.includes('Marathon Rebuild'))return [{title:'Rest',type:'rest',detail:'Recovery and mobility.'},{title:'Easy + Upper A',type:'both',detail:'6–9 km 3; upper maintenance.',lift:'upperA'},{title:'Marathon-effort practice',type:'run',detail:'8–12 km total, with 3–6 km controlled marathon effort only after full recovery.'},{title:'Easy + light Lower',type:'both',detail:'5–8 km easy, light strength.',lift:'lower'},{title:'Easy aerobic',type:'run',detail:'5–8 km easy.'},{title:'Long run',type:'run',detail:'Progress cautiously 16–28 km if recovered; no need to force 30+ km.'},{title:'Rest',type:'rest',detail:'Recover.'}];return [{title:'Easy',type:'run',detail:'Short relaxed run.'},{title:'Light upper',type:'gym',detail:'Optional light upper maintenance.',lift:'upperA'},{title:'Brief controlled effort',type:'run',detail:'Short marathon-effort segment only if fresh.'},{title:'Rest',type:'rest',detail:'Mobility.'},{title:'Easy',type:'run',detail:'Short relaxed run.'},{title:'Rest / shakeout',type:'rest',detail:'Fuel and prepare.'},{title:'Race / recovery',type:'run',detail:'October 17: Detroit Marathon. Completion goal.'}]}
const MOTIVATION=[
'You do not need a perfect day. You need to show up.',
'Easy days build the engine. Hard days test it.',

function dailyQuote(date){let n=Math.floor(dateUTC(date).getTime()/86400000);return MOTIVATION[((n%MOTIVATION.length)+MOTIVATION.length)%MOTIVATION.length]}
function htmlMotivation(){let today=iso(new Date()),why=db.settings.why||'';return `<section class="panel hero compact-hero"><div class="eyebrow">The mindset</div><h1>DISCIPLINE OVER HYPE.</h1><p class="muted">Your goals are ambitious. Your job is to stack sustainable days, not chase exhaustion.</p></section><section class="panel"><div class="mindset-meta">TODAY'S REMINDER · ${fmt(today)}</div><div class="mindset-quote">“${esc(dailyQuote(today))}”</div><div class="mindset-actions"><button class="btn" onclick="go('week')">Go to today's training →</button></div></section><section class="panel"><h2>Your reason</h2><p class="muted mini">Write why you want to finish these races and improve your physique. Keep it personal and specific.</p><textarea aria-label="My reason for training" placeholder="I'm doing this because…" onchange="db.settings.why=this.value;save()">${esc(why)}</textarea>${why?'<p class="mini muted">Saved automatically on this device.</p>':''}</section><section class="panel"><h2>Three things that matter</h2><div class="mindset-steps"><div class="stat"><label>01 · SHOW UP</label><strong>Do the next session</strong><p class="mini muted">Follow the plan, even when motivation is low.</p></div><div class="stat"><label>02 · TRAIN SMART</label><strong>Respect easy days</strong><p class="mini muted">Consistency requires recovery, not punishment.</p></div><div class="stat"><label>03 · STAY PATIENT</label><strong>Play the long game</strong><p class="mini muted">Half PR, 100 km, marathon, and a stronger physique.</p></div></div></section><section class="panel"><h2>When you don't feel like training</h2><div class="mindset-note">Check your recovery first. If you're healthy but unmotivated, start the warm-up and reassess. If you're injured, ill, or significantly fatigued, adjust the session instead of forcing it.</div></section>`}
function cleanInstructionText(value){
 return String(value||'').replace(/\bR\.?P\.?E\.?\s*\d+(?:[–-]\d+)?\b/gi,'').replace(/\s{2,}/g,' ').replace(/\s+([,.;])/g,'$1').trim();
}
function instructionList(value){
 let str=cleanInstructionText(value).replace(/^RUN PRESCRIPTION\s*[·:]\s*/i,'');
 str=str.replace(/\s+GYM:\s*/g,'; GYM: ');
 const chunks=str.split(/;\s*/).map(x=>x.trim()).filter(Boolean);
 return `<ol class="instruction-list">${chunks.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`;
}
function todayFocus(){
 const now=iso(new Date()),w=weekMonday(new Date()),i=Math.max(0,Math.min(6,dayDiff(w,now)));
 const d=prescribedDays(w)[i],l=logFor(now);
 const distance=d.target?`${Number(d.target).toFixed(1)} km`:(d.type==='rest'?'Recovery day':'Strength / mobility');
 return `<section class="panel focus-panel"><div class="focus-top"><div><div class="eyebrow">YOUR SESSION · ${esc(fmt(now))}</div><h2>${esc(d.title)}</h2></div></div>
 <div class="focus-metrics"><div><span>PLANNED</span><strong>${esc(distance)}</strong></div><div><span>TARGET PACE</span><strong>${esc(d.effort||'Recovery / gym')}</strong></div></div>
 <div class="focus-detail">${instructionList(d.detail)}</div>
 <div class="row"><button class="btn" onclick="selectedWeek=weekMonday(new Date());go('week');setTimeout(()=>{const el=document.getElementById('workout-${now}');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},50)">View & log workout →</button><span class="small">${l.done?'✓ Marked complete':'Log after training'}</span></div></section>`;
}
function htmlHome(){let today=iso(new Date());let p=phaseAt(today);let wk=weekMonday(new Date());let logs=Array.from({length:7},(_,i)=>logFor(plus(wk,i)));let completed=logs.filter(x=>x.done).length;let km=logs.reduce((n,x)=>n+(x.done?(parseFloat(x.distance)||0):0),0);return todayFocus()+`<section class="panel hero compact-hero"><div class="eyebrow">THE MISSION</div><h1>SHOW UP. STACK THE DAYS.</h1><p class="muted">Half marathon PR → 100 km backyard ultra → Detroit Marathon finish. Build a stronger physique along the way.</p><div class="row"><span class="pill">CURRENT PHASE · ${esc(p.name)}</span><button class="btn" onclick="go('week')">Open my week →</button></div></section><div class="grid"><div class="stat"><label>THIS WEEK</label><strong>${km.toFixed(1)} km</strong><div class="small">Logged distance</div></div><div class="stat"><label>COMPLETED</label><strong>${completed}/7</strong><div class="small">Daily sessions</div></div><div class="stat"><label>PHASE</label><strong style="font-size:16px">${esc(p.name.split(' ').slice(0,2).join(' '))}</strong><div class="small">Current focus</div></div></div><section class="panel"><h2>Race countdown</h2>${RACES.map(r=>`<div class="race"><div><strong>${esc(r.name)}</strong><div class="small">${fmt(r.date)} · ${esc(r.goal)}</div></div><em>${dayDiff(today,r.date)>0?dayDiff(today,r.date)+' days':dayDiff(today,r.date)===0?'RACE DAY':'Completed'}</em></div>`).join('')}</section><section class="panel"><div class="row"><h2>This week's completion</h2><b>${Math.round(completed/7*100)}%</b></div><div class="progress"><div style="width:${completed/7*100}%"></div></div><p class="muted mini">The checkboxes and run stats update automatically from My Week.</p></section><section class="panel"><div class="row"><div><div class="mindset-meta">TODAY’S MINDSET</div><div style="font-size:19px;font-weight:800;margin-top:7px;max-width:620px">“${esc(dailyQuote(today))}”</div></div><button class="btn secondary" onclick="go('motivation')">Mindset →</button></div></section>`}
function htmlWeek(){let p=phaseAt(selectedWeek),days=prescribedDays(selectedWeek);let total=0,done=0;for(let i=0;i<7;i++){let l=logFor(plus(selectedWeek,i));total+=l.done?(parseFloat(l.distance)||0):0;if(l.done)done++}return `<section class="panel"><div class="row"><div><div class="tag">Training calendar</div><h2 style="margin-top:6px">${fmt(selectedWeek)} – ${fmt(plus(selectedWeek,6))}</h2></div><div class="navweek"><button aria-label="Previous week" onclick="moveWeek(-7)" ${selectedWeek<=START?'disabled':''}>←</button><button class="week-current-btn" aria-label="Jump to current week" title="Jump to current week" ${selectedWeek===weekMonday(new Date())?'disabled aria-current="date"':''} onclick="selectedWeek=weekMonday(new Date())<START?START:weekMonday(new Date());render()">${selectedWeek===(weekMonday(new Date())<START?START:weekMonday(new Date()))?'Current week':'This week ↩'}</button><button aria-label="Next week" onclick="moveWeek(7)">→</button></div></div><div class="row"><span class="pill">${total.toFixed(1)} km logged</span><span class="pill">${done}/7 completed</span><span class="pill">${esc(weekPrescription(selectedWeek).label)}</span></div><div class="progress" style="margin-top:12px"><div style="width:${done/7*100}%"></div></div></section><section class="panel"><div class="row"><div><div class="tag">Day-by-day prescription</div><h2 style="margin:6px 0 0">Your workouts</h2></div><span class="pill">Distances in km · paces per km</span></div><p class="muted mini">Open each day to see your distance, pace, workout steps, and logging fields. Adjust for recovery and conditions.</p><div class="hint"><b>Adaptive plan:</b> ${esc(adaptiveTarget(selectedWeek,days.reduce((n,d)=>n+(d.target||0),0),weekPrescription(selectedWeek).block).reason)}. <b>Workout intensity:</b> ${esc(coachDecision(selectedWeek,weekPrescription(selectedWeek).block).reason)}. Completed workouts stay logged exactly as entered.</div><div class="field"><label>Override this week's total distance (km) · leave blank for automatic</label><input type="number" inputmode="decimal" min="0" step="0.1" value="${esc(adaptiveState().weekOverrides[selectedWeek]??'')}" placeholder="Automatic" onchange="overrideWeek('${selectedWeek}',this.value)"></div>${days.map((d,i)=>{let date=plus(selectedWeek,i),l=logFor(date);return `<article id="workout-${date}" class="workout-card ${l.done?'completed':''}"><div class="day"><div class="workout-type">${d.target?'Running prescription':d.lift?'Strength training':'Recovery / schedule'}</div><div class="workout-top"><div><div class="day-title">${DAYN[i]} · ${fmt(date)} — ${esc(d.title)}</div></div><label class="check"><input type="checkbox" ${l.done?'checked':''} onchange="logField('${date}','done',this.checked)">Done</label></div>${d.target?`<div class="workout-metrics"><div class="workout-metric"><span>Planned distance</span><strong>${esc(d.target)} km</strong></div><div class="workout-metric"><span>Target pace</span><strong>${esc(d.effort||'Easy conversational')}</strong></div></div>`:''}${d.target&&!['2027-05-30','2027-08-01','2027-10-17'].includes(date)?`<div class="fields"><div class="field"><label>Override run distance (km)</label><input type="number" min="0" step="0.1" placeholder="Automatic" value="${esc(adaptiveState().dayOverrides[date]?.target??'')}" onchange="overrideDay('${date}','target',this.value)"></div><div class="field"><label>Override target pace</label><input placeholder="Automatic" value="${esc(adaptiveState().dayOverrides[date]?.effort??'')}" onchange="overrideDay('${date}','effort',this.value)"></div></div>`:''}<div class="workout-steps"><b>${d.target?'Your workout':'Workout instructions'}</b>${instructionList(d.detail)}</div><div class="workout-log-title">Record your session</div>${d.type!=='gym'&&d.type!=='rest'?`<div class="fields"><div class="field"><label>Distance (km)</label><input inputmode="decimal" type="number" min="0" step="0.01" value="${esc(l.distance||'')}" placeholder="8.20" onchange="logField('${date}','distance',this.value)"></div><div class="field"><label>Time</label><input value="${esc(l.time||'')}" placeholder="52:24" onchange="logField('${date}','time',this.value)"></div><div class="field"><label>Avg pace /km</label><input value="${esc(l.pace||'')}" placeholder="5:30" onchange="logField('${date}','pace',this.value)"></div><div class="field"><label>Avg HR (bpm)</label><input inputmode="numeric" type="number" min="0" value="${esc(l.hr||'')}" placeholder="145" onchange="logField('${date}','hr',this.value)"></div></div>`:''}<div class="field"><label>Workout notes</label><textarea placeholder="How did it feel? Any changes?" onchange="logField('${date}','notes',this.value)">${esc(l.notes||'')}</textarea></div>${d.lift?`<p class="mini muted">${esc(gymDose(date,d.lift).label)} · Gym session: <button class="btn secondary" onclick="openLift('${date}','${d.lift}')">Log exercises →</button></p>`:''}</div></article>`}).join('')}</section><div class="hint">Running targets use your completed history: weekly mileage, missed sessions, and recent long runs. The first week remains provisional and is based on the runs you shared. Changes never rewrite logged sessions. They are not mandatory quotas. Progress gradually, and adjust training if you feel unwell or have pain. No automatic jump to high mileage.</div>`}
function htmlPlan(){let today=iso(new Date());return `<section class="panel hero"><div class="eyebrow">Annual macrocycle</div><h1>THREE START LINES.<br>ONE SYSTEM.</h1><p>Speed → endurance → recovery → marathon completion.</p></section><section class="panel"><h2>Periodized phases</h2>${PHASES.map(p=>`<div class="phase ${today>=p.start&&today<=p.end?'active':''}"><b>${esc(p.name)}</b><small>${fmt(p.start)} – ${fmt(p.end)} · ${esc(p.range)}</small><p class="mini" style="margin:5px 0 0">${esc(p.goal)}</p></div>`).join('')}</section><section class="panel"><h2>Training intensity guide</h2><div class="grid two"><div class="stat"><label>RECOVERY</label><strong style="font-size:15px">Very easy</strong><p class="mini muted">Full sentences, light effort</p></div><div class="stat"><label>EASY</label><strong style="font-size:15px">Conversational</strong><p class="mini muted">Most weekly mileage</p></div><div class="stat"><label>MARATHON</label><strong style="font-size:15px">Controlled</strong><p class="mini muted">Comfortably steady</p></div><div class="stat"><label>THRESHOLD</label><strong style="font-size:15px">Comfortably hard</strong><p class="mini muted">Not an all-out race</p></div></div><p class="muted mini">Training pace guide: easy 5:15–5:55/km, recovery 5:45–6:20+/km, threshold 4:35–4:45/km, intervals 3:55–4:15/km. Use effort over pace, especially when tired or in poor conditions.</p></section><section class="panel"><h2>Race priorities</h2><p><b>Half:</b> build threshold and long-run endurance; use a 5K/10K tune-up before setting your PR pace.</p><p><b>Backyard:</b> prioritize repeatable easy loops, walking, back-to-back sessions and gut training.</p><p><b>Detroit:</b> allow 100 km recovery to dictate the rebuild. Completion comes before time.</p></section>`}
function gymDose(date,type){const block=PHASES.findIndex(p=>date>=p.start&&date<=p.end);const raceNear=RACES.some(r=>Math.abs(dayDiff(date,r.date))<=9);if(block===4||block===7||raceNear)return {label:'Recovery / race week',mode:'skip',tip:'No scheduled heavy lifting. Optional easy mobility only; resume when recovered.'};if(block===3||block===6||block===9)return {label:'Taper — optional maintenance',mode:'light',tip:'If fresh, do only 1–2 easy sets per exercise, well short of failure. Skip lower body if legs feel heavy.'};if(type==='lower'&&coachDecision(weekMonday(dateUTC(date)),block).mode!=='normal')return {label:'Lower-body deload',mode:'light',tip:'Recovery or inconsistent training: optional 1–2 light sets only; skip if sore or symptomatic.'};if(type==='lower'&&[2,5,8].includes(block))return {label:'Reduced lower-body session',mode:'reduced',tip:'Use 1–2 sets per exercise, moderate loads and no failure. Skip if sore after quality running.'};if([2,5,8].includes(block))return {label:'Upper-body maintenance',mode:'maintenance',tip:'Use 2 sets per exercise; maintain load and technique, without training to failure.'};return {label:'Muscle-building session',mode:'full',tip:'Work through the listed sets. Keep 1–3 reps in reserve; increase weight only after all sets reach the top of the rep range cleanly.'};}
